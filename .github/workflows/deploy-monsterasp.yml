name: Deploy to MonsterASP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-monsterasp-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Csir.Spme.sln --runtime win-x64

      - name: Build solution
        run: dotnet build Csir.Spme.sln --configuration Release --no-restore

      - name: Run documentation contract tests
        run: >
          dotnet test tests/Csir.Spme.Api.IntegrationTests/Csir.Spme.Api.IntegrationTests.csproj
          --configuration Release --no-build
          --filter FullyQualifiedName~DocumentationEndpointTests

      - name: Apply database migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.MONSTERASP_MIGRATION_CONNECTION_STRING }}
          DatabaseProvider__UseSqlite: "false"
          DatabaseMigration__Apply: "true"
          DatabaseMigration__ConnectionTimeoutSeconds: "120"
        run: >
          dotnet run --project tools/Csir.Spme.Tools.DatabaseMigrator/Csir.Spme.Tools.DatabaseMigrator.csproj
          --configuration Release --no-build

      - name: Publish Web API for IIS
        run: >
          dotnet publish src/Csir.Spme.Api/Csir.Spme.Api.csproj
          --configuration Release
          --no-restore
          --output "${{ github.workspace }}\publish"
          --runtime win-x64
          --self-contained false
          /p:OpenApiGenerateDocuments=false

      - name: Enable IIS stdout logging for startup diagnostics
        shell: pwsh
        run: |
          $config = Join-Path $env:GITHUB_WORKSPACE 'publish/web.config'
          (Get-Content $config -Raw).Replace('stdoutLogEnabled="false"', 'stdoutLogEnabled="true"') | Set-Content $config
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'publish/logs') | Out-Null

      - name: Deploy to MonsterASP via Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      - name: Smoke test health and readiness
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          $checks = @(
            @{ Name = "health"; Uri = "http://csir.runasp.net/health" },
            @{ Name = "readiness"; Uri = "http://csir.runasp.net/readyz" }
          )
          foreach ($check in $checks) {
            $passed = $false
            do {
              try {
                $response = Invoke-WebRequest -Uri $check.Uri -UseBasicParsing -TimeoutSec 30
                if ($response.StatusCode -eq 200) {
                  Write-Host "$($check.Name) check passed at $($check.Uri)"
                  $passed = $true
                  break
                }
                Write-Host "$($check.Name) check returned $($response.StatusCode) at $($check.Uri)"
              } catch {
                Write-Host "$(Get-Date -Format o) $($check.Name) check not ready at $($check.Uri): $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 10
            } while ((Get-Date) -lt $deadline)
            if (-not $passed) {
              throw "$($check.Name) check failed at $($check.Uri) after waiting for IIS to recycle"
            }
          }
